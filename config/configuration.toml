[data]

	[data.features]
	drivers = ['lai', 'lst_day', 'rel_hum', 'sst', 't2m_min', 'tp', 'lsm','hur']
	targets = ['fcci_ba']
	landsea_mask = ['lsm']
	
	trn_years_list = "list(range(2001, 2017))"
	val_years_list = "list(range(2017, 2019))"
	tst_years_list = "list(range(2019, 2022))"

	[data.files]
	DATA_PATH_025KM = "os.path.join(DATA_DIR, 'data_025km.zarr')"
	DATA_PATH_100KM = "os.path.join(DATA_DIR, 'data_100km.zarr')"
	DATA_PATH_ORIGINAL = "os.path.join(DATA_DIR, 'seasfire_v03.zarr')"
	DATA_NEW_FPATH = "os.path.join(DATA_DIR, 'seasfire_v03_preprocessed.zarr')"
	NEW_DS_PATH = "lambda name: os.path.join(DATA_DIR, f'sfv03_{name.lower()}.zarr')"

[dir]
LOGS_DIR = "os.path.join(CURR_DIR, 'logs')"
EXPS_DIR = "os.path.join(CURR_DIR, 'experiments')"
DATA_DIR = "/home/jovyan/work/ML4Fires_demo" # "os.path.join(CURR_DIR, 'data')"
SCALER_DIR = "os.path.join(DATA_DIR, 'scaler')"

[mlflow]
TRACKING_INSECURE_TLS = 'true'
TRACKING_URI = "https://mlflow.intertwin.fedcloud.eu/"
EXPERIMENT_NAME = "ML4Fires_Experiment_pourya"

[toml]
tflow_fname = "tflow.toml"
torch_fname = "torch.toml"
credentials_fname = "credentials.toml"

[utils]
seed = 346	

	[utils.datetime]
	today = "str(dt.now()).split('.')[0].replace('-', '').replace(':', '').replace(' ', '_')"
    
# ------------------------------------------------------------------
# CMIP6 data configuration: 
# ------------------------------------------------------------------

[cmip6]
#rse = "VEGA-DCACHE"
rse = ""
scope = "abennasser"
model = "CMCC-ESM2"
base_dir = "/home/jovyan/data/"  # Used only for local



[cmip6.drivers]

[cmip6.drivers.lai]
type = "dynamic"
cmip6_path = "lai/[scenario]"

[cmip6.drivers.lst_day]
type = "dynamic"
cmip6_path = "lst_day/[scenario]"

[cmip6.drivers.rel_hum]
type = "dynamic"
cmip6_path = "rel_hum/[scenario]"

[cmip6.drivers.sst]
type = "dynamic"
cmip6_path = "sst/[scenario]"

[cmip6.drivers.t2m_min]
type = "dynamic"
cmip6_path = "t2m_min/[scenario]"

[cmip6.drivers.tp]
type = "dynamic"
cmip6_path = "tp/[scenario]"

[cmip6.drivers.hur]
type = "dynamic"
cmip6_path = "hur/[scenario]"

